
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR V9000</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#080808;color:white;
font-family:Arial,sans-serif;
}
header{
padding:20px;border-bottom:1px solid #ffd500;
display:flex;justify-content:space-between;
align-items:center;
}
.logo{color:#ffd500;font-size:23px;font-weight:900}
.status{color:#aaff00;font-size:11px}
main{max-width:850px;margin:auto;padding:20px}
h1{color:#ffd500;font-size:30px}
.subtitle{color:#888}
#chat{
height:55vh;overflow-y:auto;
border:1px solid #333;border-radius:12px;
padding:15px;margin:20px 0;
background:#101010;
}
.message{
padding:13px;margin:10px 0;
border-radius:10px;line-height:1.5;
white-space:pre-wrap;overflow-wrap:anywhere;
}
.bot{background:#202020;border-left:3px solid #ffd500}
.user{background:#292500;text-align:right}
.controls{display:flex;gap:8px}
input{
flex:1;min-width:0;padding:15px;
background:#151515;border:1px solid #555;
border-radius:8px;color:white;font-size:16px;
}
button{
background:#ffd500;color:black;
border:0;border-radius:8px;
padding:14px;font-weight:bold;
}
button:active{opacity:.7}
footer{text-align:center;color:#666;padding:20px;font-size:12px}
</style>
</head>
<body>

<header>
<div class="logo">✦ STAR V9000</div>
<div class="status">● SYSTEM ONLINE</div>
</header>

<main>
<h1>GOLDEN OMEGA</h1>
<p class="subtitle">Your personal AI command center</p>

<div id="chat">
<div class="message bot">
STAR V9000 INITIALIZED

Welcome, Commander.

What are we building today?
</div>
</div>

<div class="controls">
<input id="prompt" placeholder="Message STAR V9000...">
<button onclick="sendMessage()">SEND</button>
</div>
</main>

<footer>
STAR V9000 • VERSION 9000.2 • GOLDEN OMEGA
</footer>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("prompt");

function addMessage(text,type){
const msg=document.createElement("div");
msg.className="message "+type;
msg.textContent=text;
chat.appendChild(msg);
chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){
const text=input.value.trim();
if(!text)return;

addMessage(text,"user");
input.value="";

addMessage("STAR V9000 is thinking...","bot");

setTimeout(()=>{
const last=chat.lastElementChild;
last.textContent = await think(text);
},300);
}

async function think(text){
const q=text.toLowerCase();

if(q.includes("hello")||q==="hi"||q==="yo")
return "STAR V9000 ONLINE. What's the mission, Commander?";

if(q.includes("who are you"))
return "I AM STAR V9000 — GOLDEN OMEGA INTELLIGENCE.";

if(q.includes("help"))
return "COMMAND CENTER:\n\n1. Application development\n2. Coding assistance\n3. Football tactics\n4. Roblox development\n5. Creative ideas\n6. General questions";

if(q.includes("football"))
return "FOOTBALL INTELLIGENCE ACTIVATED. Tell me what we're analysing.";

if(q.includes("roblox"))
return "ROBLOX DEVELOPMENT MODE ACTIVATED. What are we creating?";

if(q.includes("code")||q.includes("program"))
return "DEVELOPER MODE ACTIVATED. Describe your project.";

if(q.includes("build"))
return "BUILD MODE ACTIVATED. Tell me what application you want to create.";

if(q.includes("thank"))
return "You're welcome, Commander. STAR V9000 standing by.";

if(q.includes("your name"))
return "My name is STAR V9000. Golden Omega intelligence.";

return "MISSION RECEIVED.\n\nYou said: "+text+
"\n\nMy basic response engine is active. The real AI brain is our next upgrade.";
}

input.addEventListener("keydown",function(e){
if(e.key==="Enter")sendMessage();
});
</script>
</body>
</html>
